{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="form-page-container">
    <form method="post" enctype="multipart/form-data" action="{{ url_for('productos.editar_producto') }}?producto_id={{ producto.id }}" class="form" onsubmit="return confirmarEdicion(event, '{{ producto.nombre }}');">
        <input type="hidden" name="producto_id" value="{{ producto.id }}">

        <div class="form-group">
            <label for="nombre">Nombre del producto:</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="precio">Precio ($):</label>
            <input type="number" step="0.01" id="precio" name="precio" value="{{ producto.precio }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="fileInput" class="file-button">📷 Cambiar imagen</label>
            <input type="file" id="fileInput" name="fileInput" accept="image/*" class="form-control-file" onchange="loadFile(event)">
        </div>

        <div class="form-group preview-container">
            <img id="preview"
                 src="{{ url_for('static', filename='img/' + (producto.imagen_url if producto.imagen_url else 'default.png')) }}"
                 alt="Vista previa del producto"
                 class="image-preview">
        </div>

        <button type="submit" class="submit-button">💾 Guardar cambios</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    function loadFile(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('preview');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            // Si no hay archivo, vuelve a mostrar la imagen original
            preview.src = "{{ url_for('static', filename='img/' + producto.imagen_url) }}";
        }
    }
    
    async function confirmarEdicion(event, nombreProducto) {
        event.preventDefault(); // Prevenir el envío automático del formulario
        
        let confirmar = false;
        if (window.confirmacionManager) {
            confirmar = await window.confirmacionManager.confirmarEdicion(nombreProducto);
        } else {
            // Fallback a confirm nativo si no está disponible
            confirmar = confirm(`¿Guardar los cambios realizados en "${nombreProducto}"?`);
        }
        
        if (confirmar) {
            event.target.submit(); // Enviar el formulario si se confirma
        }
        
        return false;
    }
</script>
{% endblock %}
