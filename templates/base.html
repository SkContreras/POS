<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Punto de Venta{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.jpeg') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="decor-bar"></div>
    <!-- Sidebar izquierda para gestión -->
    <div class="sidebar left" id="gestionSidebar">
        <button class="toggle-gestion" onclick="toggleGestion()">☰</button>
        <h3>Gestión</h3>
        <nav>
            <a href="{{ url_for('index') }}">💰 Vender</a>
            <a href="{{ url_for('agregar_producto') }}">➕ Agregar</a>
            <a href="{{ url_for('editar_lista') }}">✏️ Editar</a>
            <a href="{{ url_for('eliminar_producto') }}">🗑️ Eliminar</a>
        </nav>
    </div>
    <button class="toggle-gestion-fixed pulse" onclick="toggleGestion()">☰</button>
    {% block content %}{% endblock %}
    
    <!-- Scripts base del sistema POS - ORDEN CRÍTICO -->
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/confirmacion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    
    <script>
        // Inicializar sidebars cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar el manager de sidebars si está disponible
            if (window.sidebarManager) {
                window.sidebarManager.inicializarSidebars();
            }
        });
        
        // Función de compatibilidad para el botón del base template
        function toggleGestion() {
            if (window.sidebarManager) {
                window.sidebarManager.toggleGestion();
            } else {
                // Fallback para compatibilidad
                const gestion = document.getElementById('gestionSidebar');
                const toggleBtn = document.querySelector('.toggle-gestion-fixed');
                if (gestion) {
                    gestion.classList.toggle('collapsed');
                    if (gestion.classList.contains('collapsed')) {
                        document.body.classList.add('left-collapsed');
                        if (toggleBtn) toggleBtn.style.display = 'block';
                    } else {
                        document.body.classList.remove('left-collapsed');
                        if (toggleBtn) toggleBtn.style.display = 'none';
                    }
                }
            }
        }
        
        // Asegurar que la función esté disponible globalmente
        window.toggleGestion = toggleGestion;
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
