{% extends "base.html" %}

{% block title %}Agregar Producto{% endblock %}

{% block content %}
    <form method="post" enctype="multipart/form-data" class="form">
        <h2 class="title" style="text-align:center; margin-bottom: 24px;">Agregar Producto</h2>
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" step="0.01" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="fileInput" class="file-button">Subir Imagen</label>
            <input type="file" id="fileInput" name="fileInput" accept="image/*" class="form-control-file" onchange="loadFile(event)">
        </div>
        <div class="form-group preview-container">
            <img id="preview" src="#" alt="Vista previa" style="display:none;max-width:180px;border-radius:10px;margin-top:10px;">
        </div>
        <button type="submit" class="submit-button">Agregar</button>
    </form>
{% endblock %}


{% block sidebar %}
<div class="sidebar left" id="gestionSidebar">
    <button class="toggle-gestion" onclick="toggleGestion()">☰</button>
    <h3>Gestión</h3>
    <nav>
        <a href="{{ url_for('index') }}">💰 Vender</a>
        <a href="{{ url_for('agregar_producto') }}" class="active">➕ Agregar</a>
        <a href="{{ url_for('editar_lista') }}">✏️ Editar</a>
        <a href="{{ url_for('eliminar_producto') }}">🗑️ Eliminar</a>
        <a href="{{ url_for('historial') }}">📋 Historial</a>
    </nav>
</div>
<button id="showMenuBtn" class="show-menu-btn" onclick="toggleMenu()" style="display:none;">☰</button>
{% endblock %}

{% block scripts %}
<script>
    function loadFile(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }
</script>
{% endblock %}
