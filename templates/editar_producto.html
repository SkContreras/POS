{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}
{% block content %}
<h2 class="title">Editar Producto</h2>
<div class="menu">
    {% for p in productos %}
    <div class="producto">
        <img src="{{ url_for('static', filename='img/' ~ p[3]) }}" alt="Imagen de {{ p[1] }}">
        <h4>{{ p[1] }}</h4>
        <p>${{ "%.2f"|format(p[2]) }}</p>
        <form method="get" action="{{ url_for('editar_producto') }}">
            <input type="hidden" name="producto_id" value="{{ p[0] }}">
            <button class="editar-btn" type="submit">Editar</button>
        </form>
    </div>
    {% endfor %}
</div>
<div style="clear: both;"></div>
{% endblock %}
