{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}
{% block content %}
<div class="menu">
    {% for p in productos %}
    <div class="producto">
        {% set imagen = p[4] if p|length > 4 else '' %}
        {% if imagen %}
            <img src="{{ url_for('static', filename='img/' ~ imagen) }}" alt="Imagen de {{ p[1] }}">
        {% else %}
            <img src="{{ url_for('static', filename='img/default.png') }}" alt="Sin imagen">
        {% endif %}
        <h4>{{ p[1] }}</h4>
        <p>${{ "%.2f"|format(p[3]) }}</p>
        <form method="get" action="{{ url_for('productos.editar_producto') }}">
            <input type="hidden" name="producto_id" value="{{ p[0] }}">
            <button class="editar-btn" type="submit">Editar</button>
        </form>
    </div>
    {% endfor %}
</div>
<div style="clear: both;"></div>
{% endblock %}
